<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Saitama Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#070a12;color:#eef2ff}
button,input{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;background:radial-gradient(circle at 80% 0%,#18234d 0,#070a12 42%,#05060b 100%)}
header{height:70px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #26304b;background:#080b14dd;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.logo{font-weight:900;letter-spacing:1px;color:#7dd3fc}.logo span{color:#a78bfa}
.user{font-size:14px;color:#cbd5e1}.wrap{max-width:1200px;margin:auto;padding:32px 6%}
.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:28px;align-items:center}
h1{font-size:clamp(34px,6vw,68px);line-height:.95;margin:10px 0}h2{margin-top:0}
.grad{background:linear-gradient(90deg,#67e8f9,#a78bfa,#f0abfc);color:transparent;background-clip:text}
.card{background:#0c1120cc;border:1px solid #26304b;border-radius:22px;padding:22px;box-shadow:0 20px 60px #0006}
.saitama{min-height:330px;display:grid;place-items:center;position:relative;overflow:hidden}
.avatar{width:190px;height:250px;border-radius:48% 48% 40% 40%;background:linear-gradient(#f5cfae 0 42%,#fff 42% 55%,#e11d48 55% 100%);position:relative;box-shadow:0 0 50px #7dd3fc33;animation:float 3s ease-in-out infinite}
.avatar:before,.avatar:after{content:"";position:absolute;background:#fff;border:3px solid #111;width:58px;height:25px;top:62px;border-radius:50% 50% 45% 45%}.avatar:before{left:25px}.avatar:after{right:25px}.cape{position:absolute;bottom:0;left:-35px;width:260px;height:115px;background:#f1f5f9;border-radius:50% 50% 8px 8px;z-index:-1}
@keyframes float{50%{transform:translateY(-9px)}}.quote{color:#cbd5e1;text-align:center;margin:18px 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}.stat b{font-size:27px}.muted{color:#94a3b8;font-size:13px}
.progress{height:9px;background:#1e293b;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);width:0}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.level{cursor:pointer;transition:.2s}.level:hover{transform:translateY(-4px);border-color:#7dd3fc}.locked{opacity:.45;cursor:not-allowed}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#172036;color:#cbd5e1;font-size:12px}
.btn{border:0;border-radius:12px;padding:11px 16px;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer}.btn.alt{background:#102038;border:1px solid #334155}.btn.green{background:#059669}
input{width:100%;padding:13px 14px;margin:7px 0 13px;border-radius:11px;border:1px solid #334155;background:#080d19;color:#fff}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{max-width:470px;width:100%}.authbox h1{font-size:44px}.error{color:#fb7185;font-size:13px}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{max-width:620px;width:100%;max-height:88vh;overflow:auto}
.choice{display:block;width:100%;text-align:left;padding:14px;margin:9px 0;background:#111a2b;border:1px solid #334155;border-radius:12px;color:#fff;cursor:pointer}.choice.correct{border-color:#34d399}.choice.wrong{border-color:#fb7185}
footer{text-align:center;color:#64748b;padding:35px}.stars{font-size:25px;letter-spacing:3px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid,.levels{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.levels{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const DB="ielts_saitama_users_v1";
const levels=[
 {name:"MEDIUM",xp:100,desc:"Fondasi grammar, vocabulary & reading.",q:[
  ["Choose the correct sentence.","She goes to school every day.","She go to school every day.","She going school every day."],
  ["What is the synonym of 'rapid'?","slow","fast","weak"]]},
 {name:"HARD",xp:250,desc:"IELTS grammar, listening & academic vocabulary.",q:[
  ["If I ___ more time, I would study abroad.","have","had","will have"],
  ["'However' is commonly used to show…","contrast","cause","example"]]},
 {name:"DARKNES",xp:500,desc:"Advanced IELTS reasoning & complex structures.",q:[
  ["Which is most suitable for formal IELTS writing?","Kids nowadays kinda hate school.","Children nowadays tend to dislike school.","Kids are super mad about school."],
  ["A strong IELTS conclusion should…","introduce unrelated ideas","summarize the main argument","repeat every sentence"]]}
];
function users(){return JSON.parse(localStorage.getItem(DB)||"{}")}
function save(u){let d=users();d[u.nickname]=u;localStorage.setItem(DB,JSON.stringify(d))}
function rank(xp){if(xp>=900)return"OBSIDIAN";if(xp>=600)return"GOLD";if(xp>=300)return"STEEL";return"BRONZE"}
function start(){
 if(!localStorage.getItem("ielts_current")) renderRegister(); else renderApp();
}
function renderRegister(){
root.innerHTML=`<div class="auth"><div class="card authbox"><div class="logo">IELTS <span>SAITAMA</span> ACADEMY</div>
<h1>Unlock your <span class="grad">English.</span></h1><p class="muted">Daftar sekali. Setelah itu login cukup dengan nama panggilan.</p>
<form onsubmit="register(event)">
<label>Nama lengkap</label><input id="full" required placeholder="Nama lengkap">
<label>Nama panggilan</label><input id="nick" required placeholder="Contoh: Salman">
<label>Tanggal lahir</label><input id="birth" type="date" required>
<div id="err" class="error"></div><button class="btn" style="width:100%">DAFTAR & MASUK</button></form></div></div>`
}
function register(e){e.preventDefault();let full=fullEl("full"),nick=fullEl("nick"),birth=fullEl("birth");let d=users();if(d[nick.toLowerCase()]){err.textContent="Nama panggilan sudah terdaftar.";return}
let u={full,nickname:nick.toLowerCase(),birth,xp:0,level:0,streak:0,lastCheckin:null,created:new Date().toISOString()};save(u);localStorage.setItem("ielts_current",u.nickname);renderApp()}
function fullEl(id){return document.getElementById(id).value.trim()}
function current(){return users()[localStorage.getItem("ielts_current")]}
function renderApp(){
let u=current(), r=rank(u.xp), pct=Math.min(100,Math.round(u.xp/900*100));
root.innerHTML=`<div class="app"><header><div class="logo">IELTS <span>SAITAMA</span></div><div class="user">Hi, ${esc(u.nickname)} · <b>${r}</b> <button class="btn alt" onclick="logout()">Keluar</button></div></header>
<main class="wrap"><section class="hero"><div><span class="badge">ENGLISH × IELTS 8.5</span><h1>Halo, <span class="grad">${esc(u.nickname)}.</span></h1><p style="font-size:18px;color:#cbd5e1">Saitama siap menemani kamu naik level. Belajar singkat, latihan konsisten, target IELTS 8.5.</p>
<a class="btn" href="https://drive.google.com/drive/folders/1PRmJgR0C2w3HnakB5DGq4bmQNA8-OUfT" target="_blank" style="display:inline-block;text-decoration:none">LINK PEMBELAJARAN IELTS 8.5 ↗</a></div>
<div class="card saitama"><div class="avatar"><div class="cape"></div></div><div class="quote">“${saitamaQuote()}”<br><span class="muted">— Saitama</span></div></div></section>
<section class="grid"><div class="card stat"><span class="muted">RANK</span><b>${r}</b></div><div class="card stat"><span class="muted">XP</span><b>${u.xp}</b></div><div class="card stat"><span class="muted">STREAK</span><b>🔥 ${u.streak}</b></div><div class="card stat"><span class="muted">CHECK-IN</span><button class="btn green" onclick="checkin()">CHECK-IN HARI INI</button></div></section>
<section class="card" style="margin-top:20px"><h2>⭐ Tangga Kemampuan</h2><div class="stars">${starLine(u.xp)}</div><div class="progress"><i style="width:${pct}%"></i></div><p class="muted">Bronze → Steel → Gold → Obsidian</p></section>
<section style="margin-top:30px"><h2>🎯 Level Pembelajaran</h2><div class="levels">${levels.map((l,i)=>{let locked=i>u.level;return `<div class="card level ${locked?'locked':''}" onclick="${locked?'void(0)':`quiz(${i})`}"><span class="badge">${locked?'🔒 TERKUNCI':'✓ TERSEDIA'}</span><h2>${l.name}</h2><p class="muted">${l.desc}</p><b>+${l.xp} XP</b></div>`}).join("")}</div></section>
<section class="card" style="margin-top:25px"><h2>⚡ Metode Belajar Ringkas</h2><p>1. <b>Shadowing</b> — tirukan audio 5 menit.</p><p>2. <b>Vocabulary 5×5</b> — 5 kata baru, ulang 5 kali.</p><p>3. <b>Grammar pattern</b> — pahami pola, lalu buat 3 kalimat.</p><p>4. <b>IELTS sprint</b> — latihan reading/listening singkat setiap hari.</p></section>
<section class="card" style="margin-top:25px"><h2>🤖 Tanya Saitama</h2><input id="ask" placeholder="Contoh: bagaimana membedakan since dan for?"><button class="btn" onclick="askSaitama()">Tanya</button><p id="answer" class="muted"></p></section>
</main><footer>IELTS Saitama Academy · Data lokal demo · Gunakan HTTPS + backend untuk produksi</footer></div>`;
}
function saitamaQuote(){return ["Latihan sedikit setiap hari lebih kuat daripada belajar sekali lalu berhenti.","Tenang. Satu soal, satu langkah.","Target 8.5 dimulai dari konsistensi."][Math.floor(Math.random()*3)]}
function starLine(x){return x>=900?"★★★ ★":x>=600?"★★★☆":x>=300?"★★☆☆":"★☆☆☆"}
function quiz(i){let u=current(),l=levels[i];let html=`<div class="modal"><div class="modalbox card"><span class="badge">${l.name}</span><h2>Quiz ${l.name}</h2><p class="muted">Semua soal harus benar untuk membuka level berikutnya.</p>${l.q.map((q,n)=>`<div style="margin:20px 0"><b>${n+1}. ${q[0]}</b>${q.slice(1).map((a,k)=>`<button class="choice" onclick="choose(this,${i},${n},${k})">${a}</button>`).join("")}</div>`).join("")}<button class="btn alt" onclick="closeModal()">Tutup</button></div></div>`;document.body.insertAdjacentHTML("beforeend",html)}
let quizState={};
function choose(btn,i,n,k){let correct=(i===0&&n===0&&k===0)||(i===0&&n===1&&k===1)||(i===1&&n===0&&k===1)||(i===1&&n===1&&k===0)||(i===2&&n===0&&k===1)||(i===2&&n===1&&k===1);btn.classList.add(correct?"correct":"wrong");if(!correct){alert("Satu jawaban salah. Level berikutnya belum dapat dibuka.");return}quizState[n]=true;if(Object.keys(quizState).length===levels[i].q.length){let u=current();u.xp+=levels[i].xp;u.level=Math.max(u.level,i+1);save(u);quizState={};alert("Mantap! Level selesai dan XP bertambah.");closeModal();renderApp()}}
function closeModal(){document.querySelector(".modal")?.remove();quizState={}}
function checkin(){let u=current(),today=new Date().toISOString().slice(0,10);if(u.lastCheckin===today){alert("Kamu sudah check-in hari ini.");return}u.streak++;u.lastCheckin=today;u.xp+=10;save(u);alert("Check-in berhasil! +10 XP 🔥");renderApp()}
function askSaitama(){let q=document.getElementById("ask").value.toLowerCase(),a="Coba pecah pertanyaan menjadi pola sederhana, lalu buat contoh kalimat. Untuk IELTS, fokus pada grammar, vocabulary, coherence, dan practice.";if(q.includes("since")||q.includes("for"))a="Since dipakai untuk titik awal waktu (since 2020). For dipakai untuk durasi (for three years).";if(q.includes("ielts"))a="Mulai dari vocabulary + grammar, lanjut reading/listening, lalu rutin latihan speaking dan writing dengan timer.";document.getElementById("answer").textContent="Saitama: "+a}
function logout(){localStorage.removeItem("ielts_current");start()}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
start();
</script>
</body></html>
